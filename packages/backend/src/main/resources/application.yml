spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: omnistudy-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/omnistudy}
    username: ${DB_USERNAME:omnistudy}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_TIMEOUT:500ms}
      repositories:
        enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  # 本地直连不信任客户端自行填写的 X-Forwarded-For，避免绕过登录/注册限流。
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:NONE}

# 自定义配置
app:
  default-user:
    enabled: ${DEFAULT_USER_ENABLED:true}
    username: ${DEFAULT_USER_USERNAME:test}
    password: ${DEFAULT_USER_PASSWORD:test123}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
  auth:
    refresh-expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:30}
    principal-cache-ttl-seconds: ${AUTH_PRINCIPAL_CACHE_TTL_SECONDS:60}
  jwt:
    secret: ${JWT_SECRET:omnistudy-dev-secret-change-in-production-min-32-chars-here}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}  # 开发默认 7 天；生产配置覆盖为 30 分钟

  ai:
    credentials:
      # 生产环境必须单独设置；本地默认从 JWT secret 派生，避免把密钥明文写进数据库。
      encryption-key: ${AI_CREDENTIAL_ENCRYPTION_KEY:${JWT_SECRET:omnistudy-dev-secret-change-in-production-min-32-chars-here}}
    providers:
      dashscope:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    models:
      # 高频、低延迟、需要看视频截图
      fast-vision: qwen3-vl-flash
      # 回答评估、字幕摘要、笔记终稿与学习材料
      strong-text: qwen-plus

  agent-scope:
    enabled: ${AGENTSCOPE_ENABLED:true}
    model: ${AGENTSCOPE_MODEL:qwen3-vl-flash}
    max-iters: ${AGENTSCOPE_MAX_ITERS:3}
    max-context-tokens: ${AGENTSCOPE_MAX_CONTEXT_TOKENS:12000}
    compaction-trigger-messages: ${AGENTSCOPE_COMPACTION_MESSAGES:20}
    compaction-trigger-tokens: ${AGENTSCOPE_COMPACTION_TOKENS:8000}
    compaction-keep-messages: ${AGENTSCOPE_KEEP_MESSAGES:8}
    compaction-model: ${AGENTSCOPE_COMPACTION_MODEL:${AGENTSCOPE_MODEL:qwen3-vl-flash}}
    workspace: ${AGENTSCOPE_WORKSPACE:../../.agentscope/workspace}
    skills-directory: ${AGENTSCOPE_SKILLS_DIRECTORY:../../skills}

  usage:
    input-yuan-per-million: ${MODEL_INPUT_YUAN_PER_MILLION:0.15}
    output-yuan-per-million: ${MODEL_OUTPUT_YUAN_PER_MILLION:1.5}

  redis:
    enabled: ${REDIS_ENABLED:false}
    key-prefix: ${REDIS_KEY_PREFIX:omnistudy}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-login-limit: ${RATE_LIMIT_AUTH_LOGIN:10}
    auth-register-limit: ${RATE_LIMIT_AUTH_REGISTER:5}
    auth-refresh-limit: ${RATE_LIMIT_AUTH_REFRESH:30}
    ai-user-limit: ${RATE_LIMIT_AI_USER:30}

  ai-jobs:
    enabled: ${AI_JOBS_ENABLED:true}
    poll-delay-ms: ${AI_JOBS_POLL_DELAY_MS:1000}
    recovery-delay-ms: ${AI_JOBS_RECOVERY_DELAY_MS:60000}
    stale-after-seconds: ${AI_JOBS_STALE_AFTER_SECONDS:300}
    claim-batch-size: ${AI_JOBS_CLAIM_BATCH_SIZE:2}
    max-attempts: ${AI_JOBS_MAX_ATTEMPTS:3}

  maintenance:
    enabled: ${MAINTENANCE_ENABLED:true}

  question-bank:
    seed-enabled: ${QUESTION_BANK_SEED_ENABLED:true}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:chrome-extension://*}

management:
  metrics:
    tags:
      application: omnistudy
      role: ${APP_RUNTIME_ROLE:all-in-one}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.omnistudy: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
