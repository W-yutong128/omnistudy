global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: omnistudy-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend-api:9091"]

  - job_name: omnistudy-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend-worker:9091"]

  - job_name: omnistudy-k8s-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9191"]

  - job_name: omnistudy-k8s-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9192"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
