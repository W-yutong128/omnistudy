apiVersion: v1
kind: Secret
metadata:
  name: omnistudy-secrets
  namespace: omnistudy
type: Opaque
stringData:
  DB_URL: jdbc:postgresql://replace-with-ha-postgres:5432/omnistudy
  DB_PASSWORD: replace-me
  REDIS_HOST: replace-with-ha-redis
  REDIS_PASSWORD: replace-me
  JWT_SECRET: replace-with-at-least-32-random-characters
  AI_CREDENTIAL_ENCRYPTION_KEY: replace-with-an-independent-random-secret-at-least-32-characters
