apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: omnistudy-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: omnistudy-api
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: omnistudy-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: omnistudy-worker
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

