apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omnistudy-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.omnistudy.example.com]
      secretName: omnistudy-api-tls
  rules:
    - host: api.omnistudy.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omnistudy-api
                port:
                  name: http

