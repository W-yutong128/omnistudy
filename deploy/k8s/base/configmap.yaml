apiVersion: v1
kind: ConfigMap
metadata:
  name: omnistudy-config
data:
  SPRING_PROFILES_ACTIVE: prod
  DB_USERNAME: omnistudy
  REDIS_ENABLED: "true"
  REDIS_PORT: "6379"
  MANAGEMENT_SERVER_PORT: "9091"
  SERVER_FORWARD_HEADERS_STRATEGY: NATIVE
  DEFAULT_USER_ENABLED: "false"
  CORS_ALLOWED_ORIGINS: "chrome-extension://*"
  AGENTSCOPE_WORKSPACE: /tmp/omnistudy-agentscope
  AGENTSCOPE_SKILLS_DIRECTORY: /app/skills
  AI_JOBS_MAX_ATTEMPTS: "3"
  AI_JOBS_STALE_AFTER_SECONDS: "300"

