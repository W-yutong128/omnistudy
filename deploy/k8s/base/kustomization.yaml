apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: omnistudy
resources:
  - namespace.yaml
  - service-account.yaml
  - configmap.yaml
  - api.yaml
  - worker.yaml
  - autoscaling.yaml
  - disruption-budgets.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: omnistudy
    includeSelectors: true
